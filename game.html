<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Text-Based RPG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background-color: #1a1a2e;
      color: #e6e6e6;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    #monster-info {
      display: none;
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 10px;
      background-color: #16213e;
      border: 1px solid #2a2a4a;
    }
    .monster-health-bar {
      background: #2a2a4a;
      border-radius: 10px;
      overflow: hidden;
      margin: 10px 0;
      height: 20px;
      border: 1px solid #ff4444;
    }
    .monster-health-fill {
      background: linear-gradient(90deg, #ff4444, #ff8888);
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
    }
    .monster-status {
      font-size: 0.9em;
      color: #888;
    }
    h1 {
      color: #00ff9d;
      text-align: center;
      text-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
      margin-bottom: 30px;
    }
    button {
      margin: 5px;
      padding: 12px 20px;
      background-color: #16213e;
      color: #00ff9d;
      border: 1px solid #00ff9d;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
    }
    button:hover {
      background-color: #00ff9d;
      color: #16213e;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 255, 157, 0.4);
    }
    /* Make buttons more touch-friendly */
    button {
      -webkit-tap-highlight-color: rgba(0,0,0,0);
      touch-action: manipulation;
    }
    #log {
      white-space: pre-wrap;
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #2a2a4a;
      padding: 15px;
      border-radius: 10px;
      background-color: #16213e;
    }
    #stats {
      background-color: #16213e;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid #2a2a4a;
    }
    .health-bar {
      background: #2a2a4a;
      border-radius: 10px;
      overflow: hidden;
      margin: 10px 0;
      height: 25px;
      border: 1px solid #00ff9d;
    }
    .health-fill {
      background: linear-gradient(90deg, #00ff9d, #00b8ff);
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
    }
    #menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }
    .quest-item {
      background-color: #16213e;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
      border: 1px solid #2a2a4a;
    }
    
    .crit-msg {
      color: #ffdd00;
      font-weight: bold;
      text-shadow: 0 0 5px rgba(255, 221, 0, 0.5);
      animation: critPulse 0.5s ease-in-out;
    }
    
    .super-crit-msg {
      color: #ff5500;
      font-weight: bold;
      font-size: 1.1em;
      text-shadow: 0 0 8px rgba(255, 85, 0, 0.7);
      animation: superCritPulse 0.8s ease-in-out;
    }
    
    @keyframes critPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    @keyframes superCritPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      75% { transform: rotate(-2deg) scale(1.1); }
      100% { transform: scale(1); }
    }
    .progress-bar {
      background: #2a2a4a;
      height: 10px;
      border-radius: 5px;
      margin-top: 5px;
    }
    .progress-fill {
      background: #00ff9d;
      height: 100%;
      border-radius: 5px;
      transition: width 0.3s ease;
    }
    /* Responsive adjustments for small screens */
    @media (max-width: 720px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 1.4rem;
      }
      #stats {
        font-size: 14px;
        padding: 12px;
      }
      button {
        width: 100%;
        padding: 14px 12px;
        font-size: 16px;
        border-radius: 8px;
        margin: 6px 0;
      }
      #menu {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      #log {
        font-size: 15px;
        max-height: 50vh;
        overflow-y: auto;
      }
      .quest-item {
        padding: 12px;
        font-size: 15px;
      }
      .health-bar, .monster-health-bar {
        height: 16px;
      }
      .health-fill, .monster-health-fill {
        height: 100%;
      }
      #monster-info {
        padding: 12px;
      }
    }

    /* Slight layout tweaks for medium screens */
    @media (min-width: 721px) and (max-width: 1024px) {
      body { padding: 16px; }
      button { padding: 12px 14px; }
      #log { max-height: 40vh; }
    }
  </style>
</head>

    function renderStats() {
      let stats = `${player.name} (Lv ${player.level} ${player.class.charAt(0).toUpperCase() + player.class.slice(1)})`;

      stats += `\nATK: ${player.attack} - Gold: ${player.gold} - XP: ${player.xp}`;
      
      if (player.magicPower > 0) {
        stats += ` - Magic Power: ${player.magicPower}`;
      }
      if (player.critChance > 0) {
        stats += ` - Crit Chance: ${player.critChance}%`;
      }
      
      document.getElementById("stats").innerText = stats;
      const hpPercent = (player.hp / player.maxHp) * 100;
      document.getElementById("healthFill").style.width = hpPercent + "%";
    }

    function processMonsterDamage(monster, message) {
      let logMsg = message + "\n";
      
      // Apply poison damage if active
      if (monster.effects.poison > 0) {
        const poisonDamage = 10;
        monster.hp -= poisonDamage;
        logMsg += `☠️ Poison deals ${poisonDamage} damage!\n`;
        monster.effects.poison--;
      }
      
      // Update monster display
      if (monster.hp <= 0) {
        updateMonsterDisplay(monster, true);
        // mark defeated and clear active reference
        monster.defeated = true;
        activeMonster = null;
      } else {
        updateMonsterDisplay(monster);
      }

      let monsterDmg = monster.attack;
      
      // Check for frozen effect (30% chance to skip turn)
      if (monster.effects && monster.effects.frozen > 0) {
        const frozenRoll = Math.random() * 100;
        if (frozenRoll <= 30) {
          monsterDmg = 0;
          logMsg += "❄️ The frozen enemy misses their turn!\n";
        }
        monster.effects.frozen--;
      }

      // Apply defensive effects
      if (player.effects && player.effects.blockDuration > 0) {
        monsterDmg *= (1 - player.effects.blockAmount);
        player.effects.blockDuration--;
        if (player.effects.blockDuration === 0) {
          delete player.effects.blockAmount;
        }
      }

      player.hp -= Math.floor(monsterDmg);
      logMsg += `The ${monster.name} hits you for ${monsterDmg} damage.\n`;

      if (monster.hp <= 0 && !monster.defeated) {
        logMsg += handleMonsterDefeat(monster);
      } else if (player.hp <= 0) {
        logMsg += "You have been defeated...";
        renderMenu([{ label: "🔁 Retry", action: goTown }]);
      } else {
        showCombatMenu(monster, logMsg);
      }

      // Replace the log with the latest combat message to remove any leftover UI (e.g., Back to Combat buttons)
      renderLog(logMsg, false);
      renderStats();
    }

    function renderLog(message, append = true) {
      const log = document.getElementById("log");
      // Wrap messages in a quest-item style so they don't remove existing HTML controls
      const htmlMessage = `<div class="quest-item">${message.replace(/\n/g, '<br>')}</div>`;
      if (append) {
        log.innerHTML = htmlMessage + log.innerHTML;
      } else {
        log.innerHTML = htmlMessage;
      }
    }

    function renderMenu(buttons = []) {
      const menu = document.getElementById("menu");
      menu.innerHTML = "";
      buttons.forEach(btn => {
        const b = document.createElement("button");
        b.innerText = btn.label;
        b.onclick = btn.action;
        menu.appendChild(b);
      });
    }

    function goTown() {
      // Clear any monster display when returning to town
      updateMonsterDisplay(null);
      // Replace log content when changing location
      renderLog("Welcome to Town Square", false);
      renderStats();
      renderMenu([
        { label: "⚔️ Fight", action: fight },
        { label: "🛒 Shop", action: openShop },
        { label: "📜 Quests", action: viewQuests },

        { label: "🍻 Tavern", action: goTavern },

        { label: "💾 Save Game", action: () => { saveGame(); goTown(); } },
        { label: "📂 Load Game", action: () => { loadGame(); goTown(); } },
        { label: "🔄 New Game", action: confirmRestart }
      ]);
    }

    function fight() {
      // Determine available monster tiers based on player level
      const availableTiers = [1];
      if (player.level >= 5) availableTiers.push(2);
      if (player.level >= 10) availableTiers.push(3);
      if (player.level >= 15) availableTiers.push(4);

      // 5% chance to encounter Ancalagon if player is level 20+
      if (player.level >= 20 && Math.random() < 0.05) {
        const boss = { ...finalBoss, effects: { poison: 0 } };
        showCombatMenu(boss, "⚠️ The sky darkens... " + boss.description);
        return;
      }

      // Select monster from appropriate tier
      const tier = availableTiers[Math.floor(Math.random() * availableTiers.length)];
      const tierMonsters = monsters.filter(m => m.tier === tier);
      const monster = { 
        ...tierMonsters[Math.floor(Math.random() * tierMonsters.length)],
        effects: { poison: 0 }
      };
      
      showCombatMenu(monster, "You encountered a " + monster.name + "!");
    }

    function updateMonsterDisplay(monster, defeated = false) {
      const monsterInfo = document.getElementById("monster-info");
      const monsterName = document.getElementById("monster-name");
      const monsterHealthFill = document.getElementById("monsterHealthFill");
      const monsterStatus = document.getElementById("monster-status");

      if (!monster) {
        monsterInfo.style.display = "none";
        return;
      }

      monsterInfo.style.display = "block";
      monsterName.innerText = monster.name;
      
      // Always initialize monster state if needed
      if (!monster.effects) {
        monster = initMonster(monster);
      }
      
      // Get base monster for max HP comparison
      const baseMonster = monster.name === finalBoss.name ? finalBoss : 
        monsters.find(m => m.name === monster.name);
      const maxHp = baseMonster ? baseMonster.hp : Math.max(1, monster.hp);
      // Ensure hp is non-negative but don't modify if already 0 (prevents double-processing)
      if (monster.hp > 0) {
        monster.hp = Math.floor(monster.hp);
      }
      const hpPercent = (monster.hp / maxHp) * 100;
      
      if (defeated) {
        // Animate HP to 0 when defeated
        monsterHealthFill.style.transition = "width 1s ease-out";
        monsterHealthFill.style.width = "0%";
        setTimeout(() => {
          monsterInfo.style.display = "none";
          monsterHealthFill.style.transition = "width 0.3s ease"; // Reset transition
        }, 1000);
      } else {
        monsterHealthFill.style.width = hpPercent + "%";
      }

      // Show status effects
      let status = `HP: ${monster.hp}/${maxHp}`;
      if (monster.effects.poison > 0) {
        status += " | 🤢 Poisoned";
      }
      monsterStatus.innerText = status;
    }

    // Helper to safely create a new monster instance or reset a monster's state
    function initMonster(monsterData) {
      // Deep clone the base stats
      const monster = JSON.parse(JSON.stringify(monsterData));
      // Initialize or reset combat state
      monster.effects = monster.effects || {};
      monster.defeated = false;
      monster.hp = Math.max(0, Math.floor(monster.hp)); // Ensure valid HP
      return monster;
    }

    // Helper to handle monster defeat and rewards
    function handleMonsterDefeat(monster) {
      updateMonsterDisplay(monster, true);
      monster.defeated = true;
      activeMonster = null; // Clear active reference
      player.gold += monster.gold;
      player.xp += monster.xp;
      const msg = `You defeated the ${monster.name}!\nGold +${monster.gold}, XP +${monster.xp}`;
      updateQuestProgress(monster.name);
      checkLevelUp();
      renderMenu([{ label: "🏠 Return to Town", action: goTown }]);
      return msg;
    }

    function showCombatMenu(monster, message) {
      // Store active monster reference so menus use the live object rather than stale snapshots
      // If this is a new fight, initialize the monster
      if (!monster.effects) {
        monster = initMonster(monster);
      }
      activeMonster = monster;
      updateMonsterDisplay(monster);
      
      const buttons = [
        { label: "⚔️ Attack", action: () => attack(monster) },
        { label: "🎒 Inventory", action: () => showCombatInventory(monster) }
      ];

      // Add skills button if player has skills
      if (player.skills.length > 0) {
        buttons.push({ label: "💫 Skills", action: () => showSkills(monster) });
      }

      // Add spells button if player has spells
      if (player.spells.length > 0) {
        buttons.push({ label: "✨ Spells", action: () => showSpells(monster) });
      }

      buttons.push({ label: "🏃 Flee", action: goTown });

      // Replace the log with the combat message so previous UI text doesn't carry over
      renderLog(message, false);
      renderMenu(buttons);
    }

    function showCombatInventory(monster) {
      const monsterState = encodeURIComponent(JSON.stringify(monster));
      let html = "<h3>🎒 Combat Inventory</h3>";
      player.inventory.forEach((item, i) => {
        if (item.type === "consumable") {
          html += `
            <div class="quest-item">
              ${item.name} - ${item.description}<br>
              <button onclick='useCombatItem(${i}, "${monsterState}")'>Use</button>
            </div>`;
        }
      });
      if (!monster.defeated && monster.hp > 0) {
        html += `<br><button onclick='returnToCombat("${monsterState}")'>Back to Combat</button>`;
      } else {
        html += `<br><button onclick='goTown()'>Return to Town</button>`;
      }
      document.getElementById("log").innerHTML = html;
    }

    function showSkills(monster) {
      const monsterState = encodeURIComponent(JSON.stringify(monster));
      let html = "<h3>💫 Skills</h3>";
      player.skills.forEach((skill, i) => {
        const canUse = player.mp >= skill.mpCost;
        html += `
          <div class="quest-item">
            ${skill.name} - ${skill.description}<br>
            MP Cost: ${skill.mpCost}<br>
            <button onclick='useSkill(${i}, "${monsterState}")' ${canUse ? '' : 'disabled'}>
              Use Skill ${canUse ? '' : '(Not enough MP)'}
            </button>
          </div>`;
      });
      if (!monster.defeated && monster.hp > 0) {
        html += `<br><button onclick='returnToCombat("${monsterState}")'>Back to Combat</button>`;
      } else {
        html += `<br><button onclick='goTown()'>Return to Town</button>`;
      }
      document.getElementById("log").innerHTML = html;
    }

    function showSpells(monster) {
      const monsterState = encodeURIComponent(JSON.stringify(monster));
      let html = "<h3>✨ Spells</h3>";
      player.spells.forEach((spell, i) => {
        const canCast = player.mp >= spell.mpCost;
        html += `
          <div class="quest-item">
            ${spell.name} - ${spell.description}<br>
            MP Cost: ${spell.mpCost}<br>
            <button onclick='castSpell(${i}, "${monsterState}")' ${canCast ? '' : 'disabled'}>
              Cast Spell ${canCast ? '' : '(Not enough MP)'}
            </button>
          </div>`;
      });
      if (!monster.defeated && monster.hp > 0) {
        html += `<br><button onclick='returnToCombat("${monsterState}")'>Back to Combat</button>`;
      } else {
        html += `<br><button onclick='goTown()'>Return to Town</button>`;
      }
      document.getElementById("log").innerHTML = html;
    }

    function useCombatItem(index, monsterState) {
      const item = player.inventory[index];
      const monster = activeMonster || JSON.parse(decodeURIComponent(monsterState));
      if (item.type === "consumable") {
        if (item.restoreMp) {
          player.mp = Math.min(player.maxMp, player.mp + item.effect);
          renderLog(`Used ${item.name}. Restored ${item.effect} MP.`);
        } else {
          player.hp = Math.min(player.maxHp, player.hp + item.effect);
          renderLog(`Used ${item.name}. Healed ${item.effect} HP.`);
        }
        player.inventory.splice(index, 1);
        renderStats();
        if (!monster.defeated && monster.hp > 0) {
          showCombatMenu(monster, "Combat continues...");
        } else {
          activeMonster = null;
          renderLog(`The ${monster.name} has already been defeated.`, false);
        }
      }
    }

    function castSpell(index, monsterState) {
      // Prefer the live activeMonster if present to avoid stale snapshots
      const monster = activeMonster || JSON.parse(decodeURIComponent(monsterState));
      const spell = player.spells[index];
      if (player.mp >= spell.mpCost) {
        player.mp -= spell.mpCost;
        let damage = spell.damage || 0;
        if (damage > 0) {
          // Magic power adds flat damage to spells (predictable with equipment)
          damage = Math.floor(damage + player.magicPower);
          monster.hp -= damage;
          let msg = `You cast ${spell.name} dealing ${damage} magic damage!`;
          
          // Apply Frostbolt freeze effect
          if (spell.freezeDuration > 0) {
            monster.effects = monster.effects || {};
            monster.effects.frozen = (monster.effects.frozen || 0) + spell.freezeDuration;
            msg += "\n❄️ Enemy is frozen!";
          }
          
          processMonsterDamage(monster, msg);
          if (monster.hp <= 0) activeMonster = null;
        } else if (spell.healing) {
          const healing = Math.floor(spell.healing + Math.floor(player.magicPower / 2));
          player.hp = Math.min(player.maxHp, player.hp + healing);
          renderStats();
          showCombatMenu(monster, `You cast ${spell.name} healing ${healing} HP!`);
        }
      }
    }

    function returnToCombat(monsterState) {
      const monster = activeMonster || JSON.parse(decodeURIComponent(monsterState));
      if (!monster || monster.hp <= 0 || monster.defeated) {
        renderLog("That enemy has already been defeated.", false);
        return;
      }
      showCombatMenu(monster, "Combat continues...");
    }

    function useSkill(index, monsterState) {
      const monster = activeMonster || JSON.parse(decodeURIComponent(monsterState));
      const skill = player.skills[index];
      
      if (player.mp < skill.mpCost) {
        showCombatMenu(monster, "Not enough MP to use " + skill.name);
        return;
      }

      player.mp -= skill.mpCost;
      let damage = 0;
      let message = "";

      // Calculate damage based on skill type
      if (skill.isMagic) {
        damage = Math.floor((player.magicPower + player.attack) * skill.damage);
      } else {
        damage = Math.floor(player.attack * skill.damage);
      }

      // Two-tier crit system for rogues (normal crit up to 100%, overflow gives chance for super crit)
      if (player.class === "rogue") {
        const missChance = 0; // skill hits are assumed to land unless specific skill says otherwise
        if (player.critChance > 0) {
          const critRoll = Math.random() * 100;
          const critChanceCap = Math.min(player.critChance, 100);
          let isCrit = false;
          if (critRoll <= critChanceCap) {
            isCrit = true;
            damage *= 2;
          }
          if (isCrit && player.critChance > 100) {
            const overflow = player.critChance - 100;
            const superRoll = Math.random() * 100;
            if (superRoll <= overflow) {
              damage = Math.floor(damage * 1.5) * 2; // apply extra multiplier for super crit (x3 total)
              message += `<span class="super-crit-msg">💥 SUPER CRITICAL HIT! 💥</span> `;
            } else {
              message += `<span class="crit-msg">⚡ CRITICAL HIT! ⚡</span> `;
            }
          } else if (isCrit) {
            message += `<span class="crit-msg">⚡ CRITICAL HIT! ⚡</span> `;
          }
        }
      }

      // Apply skill effects
      if (skill.id === "poisonStrike") {
        monster.effects.poison = skill.dotDuration;
        message += `Applied poison for ${skill.dotDuration} turns! `;
      } else if (skill.id === "shieldBlock") {
        player.effects = player.effects || {};
        player.effects.blockDuration = skill.duration;
        player.effects.blockAmount = skill.block;
        message += "Defensive stance activated! ";
        showCombatMenu(monster, `${message}Damage reduced by ${skill.block * 100}% for ${skill.duration} turn(s)!`);
        return;
      }

      monster.hp -= damage;
      processMonsterDamage(monster, `${message}You used ${skill.name} dealing ${damage} damage!`);
    }

    function attack(monster) {
      // prefer the live activeMonster reference when available
      if (activeMonster) monster = activeMonster;
      const miss = Math.random() < 0.1;

      // Two-tier crit system: normal crit up to 100%, overflow becomes chance to upgrade crit into a super crit
      let crit = false;
      let superCrit = false;
      if (!miss && player.class === "rogue" && player.critChance > 0) {
        const critRoll = Math.random() * 100;
        const critChanceCap = Math.min(player.critChance, 100);
        if (critRoll <= critChanceCap) {
          crit = true;
          if (player.critChance > 100) {
            const overflow = player.critChance - 100; // e.g. 105 -> overflow 5%
            const superRoll = Math.random() * 100;
            if (superRoll <= overflow) superCrit = true;
          }
        }
      }

      const playerDmg = miss ? 0 : superCrit ? player.attack * 3 : crit ? player.attack * 2 : player.attack;
      let monsterDmg = monster.attack;

      monster.hp -= playerDmg;
      player.hp -= monsterDmg;

      // Build combat message with styled crit text
      let hitMsg;
      if (miss) {
        hitMsg = "missed";
      } else if (superCrit) {
        hitMsg = `<span class="super-crit-msg">💥 SUPER CRITICAL HIT! 💥</span>`;
      } else if (crit) {
        hitMsg = `<span class="crit-msg">⚡ CRITICAL HIT! ⚡</span>`;
      } else {
        hitMsg = "hit";
      }

      let logMsg = `You ${hitMsg} the ${monster.name} for ${playerDmg} damage.\n`;
      logMsg += `The ${monster.name} hits you for ${monsterDmg} damage.\n`;

      if (monster.hp <= 0 && !monster.defeated) {
        // Process monster defeat and get reward message
        logMsg += handleMonsterDefeat(monster);
      } else if (player.hp <= 0) {
        logMsg += "You have been defeated...";
        renderMenu([{ label: "🔁 Retry", action: goTown }]);
      } else {
        showCombatMenu(monster, logMsg);
      }

      // Replace the log so any previous UI (like Back to Combat) is cleared
      renderLog(logMsg, false);
      renderStats();
    }

    function checkLevelUp() {
      const xpNeeded = player.level * 50;
      if (player.xp >= xpNeeded) {
        player.level++;
        player.xp = 0;
        player.maxHp += 20;
        player.baseAttack += 5;
        player.hp = player.maxHp;
        player.attack = player.baseAttack + (player.equipped.weapon?.attack || 0);
        renderLog(`🎉 You leveled up to Lv ${player.level}!\n+20 Max HP, +5 Base ATK`, true);
      }
    }

    function openInventory() {
      let html = "<h3>🎒 Inventory</h3>";
      player.inventory.forEach((item, i) => {
        html += `<div class="quest-item">
          <strong>${item.name}</strong><br>
          <em>${item.description}</em><br>`;
        if (item.type === "consumable") {
          html += `<button onclick="useItem(${i})">Use</button>`;
        } else {
          const isEquipped = 
            (item.type === "weapon" && player.equipped.weapon === item) ||
            (item.type === "armor" && player.equipped.armor === item);
          html += `<button onclick="equipItem(${i})">${isEquipped ? 'Equipped' : 'Equip'}</button>`;
        }
        html += '</div>';
      });
      html += `<br><button onclick="goTown()">Return to Town</button>`;
      document.getElementById("log").innerHTML = html;
    }

    function useItem(index) {
      const item = player.inventory[index];
      if (item.type === "consumable") {
        if (item.restoreMp) {
          player.mp = Math.min(player.maxMp, player.mp + item.effect);
          renderLog(`Used ${item.name}. Restored ${item.effect} MP.`);
        } else {
          player.hp = Math.min(player.maxHp, player.hp + item.effect);
          renderLog(`Used ${item.name}. Healed ${item.effect} HP.`);
        }
        player.inventory.splice(index, 1);
        renderStats();
      }
    }

    function equipItem(index) {
      const item = player.inventory[index];
      let oldItem = null;
      let statsChanged = [];
      
      if (item.type === "weapon") {
        oldItem = player.equipped.weapon;
        if (oldItem) {
          player.attack -= oldItem.attack;
          if (oldItem.magicPower) {
            player.magicPower -= oldItem.magicPower;
            statsChanged.push(`Magic Power ${-oldItem.magicPower}`);
          }
          if (oldItem.critChance) {
            player.critChance -= oldItem.critChance;
            statsChanged.push(`Crit Chance ${-oldItem.critChance}%`);
          }
        }
        
        player.equipped.weapon = item;
        player.attack = player.baseAttack + item.attack;
        statsChanged.push(`Attack +${item.attack}`);
        
        if (item.magicPower) {
          player.magicPower += item.magicPower;
          statsChanged.push(`Magic Power +${item.magicPower}`);
        }
        if (item.critChance) {
          player.critChance += item.critChance;
          statsChanged.push(`Crit Chance +${item.critChance}%`);
        }
      } else if (item.type === "armor") {
        oldItem = player.equipped.armor;
        if (oldItem) {
          player.maxHp -= oldItem.hp;
          if (oldItem.magicPower) {
            player.magicPower -= oldItem.magicPower;
            statsChanged.push(`Magic Power ${-oldItem.magicPower}`);
          }
          if (oldItem.critChance) {
            player.critChance -= oldItem.critChance;
            statsChanged.push(`Crit Chance ${-oldItem.critChance}%`);
          }
        }
        
        player.equipped.armor = item;
        player.maxHp += item.hp;
        statsChanged.push(`Max HP +${item.hp}`);
        
        if (player.hp > player.maxHp) player.hp = player.maxHp;
        
        if (item.magicPower) {
          player.magicPower += item.magicPower;
          statsChanged.push(`Magic Power +${item.magicPower}`);
        }
        if (item.critChance) {
          player.critChance += item.critChance;
          statsChanged.push(`Crit Chance +${item.critChance}%`);
        }
      }
      
      renderStats();
      openInventory(); // Refresh inventory display
      
      // Show equipment confirmation with stat changes
      let confirmMsg = `Equipped ${item.name}.\n`;
      if (oldItem) {
        confirmMsg += `Unequipped ${oldItem.name}.\n`;
      }
      confirmMsg += `Stat changes:\n${statsChanged.join('\n')}`;
      
      document.getElementById("log").innerHTML = document.getElementById("log").innerHTML + 
        `<div class="quest-item" style="background-color: #1a4a1a; margin-top: 10px;">${confirmMsg}</div>`;
    }

    function openShop() {
      let html = "<h3>🛒 Shop</h3>";
      
      // Group items by category
      const categories = {
        weapon: "⚔️ Weapons",
        armor: "🛡️ Armor",
        consumable: "🧪 Consumables"
      };
      
      for (const [type, title] of Object.entries(categories)) {
        const categoryItems = shopItems.filter(item => item.type === type && 
          (!item.class || item.class === player.class));
        
        if (categoryItems.length > 0) {
          html += `<h4>${title}</h4>`;
          categoryItems.forEach((item, i) => {
            const canAfford = player.gold >= item.cost;
            html += `<div class="quest-item">
              <strong>${item.name}</strong> - ${item.cost} Gold<br>
              <em>${item.description}</em><br>
              <button onclick="buyItem(${shopItems.indexOf(item)})" ${canAfford ? '' : 'disabled'}>
                ${canAfford ? 'Buy' : 'Not enough gold'}
              </button>
            </div>`;
          });
        }
      }
      
      html += `<br><button onclick="goTown()">Return to Town</button>`;
      document.getElementById("log").innerHTML = html;
    }

    function buyItem(index) {
      const item = shopItems[index];
      if (player.gold >= item.cost) {
        player.gold -= item.cost;
        player.inventory.push({...item}); // Clone the item
        renderStats();
        // Re-render shop with updated gold values
        openShop();
        // Show purchase confirmation with stats
        let confirmMsg = `Bought ${item.name} for ${item.cost} gold.\n`;
        if (item.attack) confirmMsg += `Attack: +${item.attack}\n`;
        if (item.hp) confirmMsg += `HP: +${item.hp}\n`;
        if (item.magicPower) confirmMsg += `Magic Power: +${item.magicPower}\n`;
        if (item.critChance) confirmMsg += `Crit Chance: +${item.critChance}%\n`;
        document.getElementById("log").innerHTML = document.getElementById("log").innerHTML + 
          `<div class="quest-item" style="background-color: #1a4a1a; margin-top: 10px;">${confirmMsg}</div>`;
      } else {
        const needed = item.cost - player.gold;
        document.getElementById("log").innerHTML = document.getElementById("log").innerHTML + 
          `<div class="quest-item" style="background-color: #4a1a1a; margin-top: 10px;">
           Not enough gold. Need ${needed} more gold.</div>`;
      }
    }

    function viewQuests() {
      let html = "<h3>📜 Available Quests</h3>";
      availableQuests.forEach(quest => {
        const activeQuest = player.quests.find(q => q.id === quest.id);
        if (!activeQuest) {
          html += `
            <div class="quest-item">
              <strong>${quest.name}</strong><br>
              ${quest.description}<br>
              Reward: ${quest.reward.gold} Gold, ${quest.reward.xp} XP<br>
              <button onclick="acceptQuest(${quest.id})">Accept Quest</button>
            </div>`;
        }
      });
      
      if (player.quests.length > 0) {
        html += "<h3>Active Quests</h3>";
        player.quests.forEach(quest => {
          const questTemplate = availableQuests.find(q => q.id === quest.id);
          const progress = (quest.progress / questTemplate.required) * 100;
          html += `
            <div class="quest-item">
              <strong>${questTemplate.name}</strong><br>
              Progress: ${quest.progress}/${questTemplate.required}<br>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${progress}%"></div>
              </div>
            </div>`;
        });
      }
      html += `<br><button onclick="goTown()">Return to Town</button>`;
      document.getElementById("log").innerHTML = html;
    }

    function acceptQuest(questId) {
      const quest = availableQuests.find(q => q.id === questId);
      if (quest) {
        player.quests.push({
          id: quest.id,
          progress: 0
        });
        renderLog(`Accepted quest: ${quest.name}`);
        viewQuests();
      }
    }

    function showVictoryScreen() {
      document.getElementById("log").innerHTML = `
        <div style="text-align: center; padding: 20px;">
          <h1 style="color: #00ff9d; text-shadow: 0 0 10px rgba(0, 255, 157, 0.5);">
            🎉 Victory! 🎉
          </h1>
          <p>You have defeated Ancalagon the Black Dragon and become a legend!</p>
          <p>Final Stats:</p>
          <p>Level ${player.level} ${player.class.charAt(0).toUpperCase() + player.class.slice(1)}</p>
          <p>Gold: ${player.gold}</p>
          <p>Thank you for playing!</p>
          <button onclick="startNewGame()">Start New Game</button>
        </div>
      `;
      document.getElementById("menu").innerHTML = "";
    }

    function startNewGame() {
      localStorage.removeItem("rpgSave");
      // Reset player to initial state
      Object.assign(player, {
        name: "Hero",
        level: 1,
        xp: 0,
        maxHp: 100,
        hp: 100,
        maxMp: 50,
        mp: 50,
        baseAttack: 10,
        attack: 10,
        magicPower: 0,
        critChance: 5,
        gold: 50,
        class: "none",
        quests: [],
        inventory: [
          { name: "🧪 Health Potion", type: "consumable", effect: 30, description: "Restores 30 HP" },
          { name: "🧪 Mana Potion", type: "consumable", effect: 20, description: "Restores 20 MP", restoreMp: true },
          { name: "⚔️ Wooden Sword", type: "weapon", attack: 5, description: "A basic wooden sword. +5 Attack" },
          { name: "🛡️ Leather Armor", type: "armor", hp: 10, description: "Basic leather protection. +10 HP" }
        ],
        equipped: { weapon: null, armor: null },
        spells: [],
        skills: []
      });
      
      renderLog("Starting new game...");
      goTown();
    }

    function confirmRestart() {
      document.getElementById("log").innerHTML = `
        <h3>🔄 Start New Game?</h3>
        <p>Are you sure you want to start a new game? All current progress will be lost.</p>
        <button onclick="startNewGame()">Yes, Start New Game</button>
        <button onclick="goTown()">No, Return to Town</button>
      `;
    }

    function updateQuestProgress(monsterName) {
      player.quests.forEach((quest, index) => {
        const questTemplate = availableQuests.find(q => q.id === quest.id);
        if (questTemplate.target === monsterName) {
          quest.progress++;
          if (quest.progress >= questTemplate.required) {
            // Complete quest
            player.gold += questTemplate.reward.gold;
            player.xp += questTemplate.reward.xp;
            
            // Handle special rewards
            if (questTemplate.reward.skill) {
              if (questTemplate.reward.skill === "shieldBlock") {
                player.skills.push(skills.warrior.shieldBlock);
              } else if (questTemplate.reward.skill === "poison") {
                player.skills.push(skills.rogue.poison);
              }
            }
            if (questTemplate.reward.spell) {
              if (questTemplate.reward.spell === "frostbolt") {
                player.spells.push(spells.frostbolt);
              }
            }
            
            player.quests.splice(index, 1);
            let message = `🎉 Quest Complete: ${questTemplate.name}!\nReceived: ${questTemplate.reward.gold} Gold, ${questTemplate.reward.xp} XP`;
            
            if (questTemplate.reward.skill || questTemplate.reward.spell) {
              message += "\nNew ability unlocked!";
            }

            if (questTemplate.reward.victory) {
              showVictoryScreen();
            } else {
              renderLog(message);
            }
            
            checkLevelUp();
          }
        }
      });
    }

    function goTavern() {
      const healCost = 20;
      if (player.hp < player.maxHp || player.mp < player.maxMp) {
        document.getElementById("log").innerHTML = `
          <h3>🍻 Welcome to the Tavern</h3>
          <p>Rest and restore all HP and MP for ${healCost} gold?</p>
          <button onclick="healAtTavern()">Rest</button>
          <button onclick="goTown()">Leave Tavern</button>
        `;
      } else {
        document.getElementById("log").innerHTML = `
          <h3>🍻 Welcome to the Tavern</h3>
          <p>You are already at full health and mana!</p>
          <button onclick="goTown()">Leave Tavern</button>
        `;
      }
    }

    function healAtTavern() {
      const healCost = 20;
      if (player.gold >= healCost) {
        player.hp = player.maxHp;
        player.mp = player.maxMp;
        player.gold -= healCost;
        // After healing, re-render the tavern so the Rest button is removed when at full HP/MP
        renderLog(`You have been fully restored! Cost: ${healCost} Gold.`, false);
        renderStats();
        goTavern();
      } else {
        renderLog("Not enough gold to heal.");
      }
    }

    function saveGame() {
      localStorage.setItem("rpgSave", JSON.stringify(player));
      renderLog("💾 Game saved.");
    }

    function loadGame() {
      const data = localStorage.getItem("rpgSave");
      if (data) {
        Object.assign(player, JSON.parse(data));
        renderLog("📂 Game loaded.");
        renderStats();
        goTown(); // Go to town after loading
        return true;
      }
      return false;
    }

    function selectClass() {
      let html = "<h2>Choose Your Class</h2>";
      const classes = [
        { id: "warrior", name: "⚔️ Warrior", description: "Strong and durable. Specializes in weapons and defensive skills." },
        { id: "mage", name: "🔮 Mage", description: "Master of magic. Can learn powerful spells and use magical staves." },
        { id: "rogue", name: "🗡️ Rogue", description: "Quick and deadly. High critical chance and poison abilities." }
      ];

      classes.forEach(c => {
        html += `
          <div class="quest-item">
            <strong>${c.name}</strong><br>
            ${c.description}<br>
            <button onclick="chooseClass('${c.id}')">Select ${c.name}</button>
          </div>`;
      });
      document.getElementById("log").innerHTML = html;
      document.getElementById("menu").innerHTML = "";
    }

    function chooseClass(classId) {
      player.class = classId;
      
      // Give starting equipment based on class
      // Reset player stats
      player.maxHp = 100;
      player.hp = 100;
      player.maxMp = 50;
      player.mp = 50;
      player.baseAttack = 10;
      player.attack = 10;
      player.magicPower = 0;
      player.critChance = 5;
      player.skills = [];
      player.spells = [];
      player.inventory = [
        { name: "🧪 Health Potion", type: "consumable", effect: 30, description: "Restores 30 HP" },
        { name: "🧪 Mana Potion", type: "consumable", effect: 20, description: "Restores 20 MP", restoreMp: true }
      ];
      player.equipped = { weapon: null, armor: null };

      if (classId === "warrior") {
        player.maxHp += 50; // Warriors have more HP
        player.hp = player.maxHp;
        player.baseAttack += 5;
        player.attack += 5;
        player.inventory.push(
          { name: "⚔️ Training Sword", type: "weapon", attack: 8, class: "warrior", description: "A basic training sword. +8 Attack" }
        );
        player.skills.push(skillsList.warrior[0]); // Start with Power Strike
      } else if (classId === "mage") {
        player.maxMp += 50; // Mages have more MP
        player.mp = player.maxMp;
        player.magicPower = 10;
        player.inventory.push(
          { name: "🔮 Training Staff", type: "weapon", attack: 3, magicPower: 8, class: "mage", description: "A basic magic staff. +3 Attack, +8 Magic Power" }
        );
        player.spells.push(spells.fireball);
      } else if (classId === "rogue") {
        player.critChance += 10; // Rogues have higher crit chance
        player.attack += 3;
        player.inventory.push(
          { name: "🗡️ Training Dagger", type: "weapon", attack: 6, critChance: 8, class: "rogue", description: "A basic dagger. +6 Attack, +8% Crit Chance" }
        );
        player.skills.push(skillsList.rogue[0]); // Start with Backstab
      }
      
      // Grant class abilities appropriate for player's level (avoid duplicates)
      const classSkills = skillsList[classId] || [];
      classSkills.forEach(s => {
        if ((s.levelRequired || 1) <= player.level) {
          if (!player.skills.find(ps => ps.id === s.id || ps.name === s.name)) {
            player.skills.push(s);
          }
        }
      });
      if (classId === 'mage') {
        Object.values(spells).forEach(sp => {
          if ((sp.levelRequired || 1) <= player.level) {
            if (!player.spells.find(ps => ps.name === sp.name)) player.spells.push(sp);
          }
        });
      }

      // Return to town UI but replace log with a confirmation message showing the chosen class and abilities
      goTown();
      const classNames = { warrior: 'Warrior', mage: 'Mage', rogue: 'Rogue' };
      const chosenName = classNames[classId] || classId;
      let confirmMsg = `You are now a ${chosenName}.\n`;
      
      // List skills and spells gained
      if (player.skills.length > 0) {
        confirmMsg += "\nSkills learned:";
        player.skills.forEach(s => {
          confirmMsg += `\n- ${s.name}`;
        });
      }
      if (player.spells && player.spells.length > 0) {
        confirmMsg += "\nSpells learned:";
        player.spells.forEach(s => {
          confirmMsg += `\n- ${s.name}`;
        });
      }
      
      renderLog(confirmMsg, false);
    }

    // Initial load
    if (!loadGame()) {
      selectClass();
    }
  </script>
</body>
</html>
